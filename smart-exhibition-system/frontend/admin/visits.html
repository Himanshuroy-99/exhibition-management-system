<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visits — EXHIBIT/OS Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="dash-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span> EXHIBIT/OS</div>
    <div class="role-tag">Admin Panel</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="users.html">Users</a>
      <a href="exhibitions.html">Exhibitions</a>
      <a href="participants.html">Participants</a>
      <a href="visits.html" class="active">Visits</a>
    </nav>
    <div class="sidebar-footer">
      <a href="../login.html" class="logout-link">← Log out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h1>Visits</h1>
      <div class="user-chip">
        <div class="avatar" id="userInitial">A</div>
        <span id="userName">Admin</span>
      </div>
    </div>

    <div class="dash-body">

      <div class="panel">
        <div class="panel-head">
          <h3>Visitor Logs</h3>
        </div>
        <div class="toolbar">
          <select id="exhibitionFilter">
            <option value="">All exhibitions</option>
            <!-- options injected by admin-visits.js -->
          </select>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Visitor</th>
              <th>Email</th>
              <th>City</th>
              <th>Exhibition</th>
              <th>Hall / Booth</th>
              <th>Exhibitor</th>
              <th>Visit Date</th>
              <th>Entry</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="visitsBody">
            <!-- rows injected -->
          </tbody>
        </table>
      </div>

    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/admin-visits.js"></script>
</body>
</html>
